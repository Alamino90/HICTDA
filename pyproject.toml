[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hictda"
version = "0.1.1"
description = "Persistent-homology analysis of Hi-C chromatin contact maps."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alamin Mustafa", email = "alamin900005@gmail.com"}
]

maintainers = [
    { name = "Alamin Mustafa" }
]

keywords = [
    "Hi-C",
    "chromatin",
    "Topologically Associating Domains",
    "topological data analysis",
    "persistent homology",
    "bioinformatics",
    "computational biology"
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "hic-straw>=1.3.1",
    "ripser>=0.6.12",
    "persim>=0.3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.scripts]
hictda = "hictda.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
